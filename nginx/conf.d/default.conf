upstream backend_app {
    server backend:8000;
}

server {
    listen 80;
    server_name santexnika-loyha.duckdns.org;


    # Maximum request body size for uploads
    client_max_body_size 50M;

    # Static fayllar va yuklangan rasmlarni ulash va kesh mashg'ulotlari
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Backend API ga proxy request
    location / {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy API requests
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # =========================================================
    # HTTPS / SSL Certbot Sozlamasi (SSL sertifikat tayyor bo'lgach ishlatiladi)
    # =========================================================
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }
}

