version: '3.8'

services:
  # ---------------------------------------------------------
  # 1. FastAPI Backend Service (Bound to localhost:8000 for Host Nginx Proxy)
  # ---------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: santexnika_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:?Error: DATABASE_URL is required in .env}
      - SECRET_KEY=${SECRET_KEY:?Error: SECRET_KEY is required in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - static_data:/app/static
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------
  # 2. PostgreSQL Database Service (Internal network only)
  # ---------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: santexnika_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Error: POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Error: POSTGRES_DB is required in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    driver: local
  sqlite_data:
    driver: local
  static_data:
    driver: local
