version: '3.8'

services:
  # ---------------------------------------------------------
  # 1. FastAPI Backend Service (Gunicorn + Uvicorn Workers)
  # ---------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: santexnika_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://santex_user:santex_secret_pass@db:5432/santexnika_db}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - static_data:/app/static
      - sqlite_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------
  # 2. PostgreSQL Database Service (Production tavsiya etiladi)
  # ---------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: santexnika_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-santex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-santex_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-santexnika_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-santex_user} -d $${POSTGRES_DB:-santexnika_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------
  # 3. Nginx Reverse Proxy Service
  # ---------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: santexnika_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_data:/usr/share/nginx/html/static:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  sqlite_data:
    driver: local
  static_data:
    driver: local
